<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu</title>
    <link href="https://cdnfonts.com" rel="stylesheet">
    <style>
               *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
            font-family: 'SamsungOne', sans-serif;
        }
        /* ⭐️ [추가] 브라우저 전체의 기본 흰색 배경을 원천 차단 */
        body {
            background-color: black;
            overflow-x: hidden;
        }
        .main{
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 10px;
            width: 100%; /* 부모 너비 확보 */
        }
        .phone{
            width: 100%;
            max-width: 100%;  
            height: 100vh;
            object-fit: cover;
        }
        .comment{
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            margin-top: -300px; /* 텍스트를 위로 조금 더 끌어올림 */
            position: relative;
            z-index: 5;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 60px;
            background-color: black;
            width: 100%;
        }
        .comment span:first-child{
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        .comment span:last-child{
            font-size: 24px;
            color: darkgray;
        }
        /* ⭐️ [추가] 메뉴 버튼 영역도 마이너스 마진으로 이미지 검은 반사 구역 위로 올림 */
        .menu-wrap {
            margin-top: -160px; 
            position: relative;
            z-index: 5;
        }
        ul{
            list-style-type: none;
            display: flex;
            gap : 100px;
        }
        /* 기획안처럼 링크 글씨 밑줄 및 디자인 제거 */
        ul li a {
            color: white;
            text-decoration: none;
            border-bottom: 2px solid white;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
            <img src="phone6.jpeg" class="phone">
            <div class="comment">
                <span>Galaxy S26 Ultra</span>
                <span>상상했던 모든 혁신을 가장 얇고 가볍게. 갤럭시 S26 울트라.<br>
                    F1.4 카메라로 어둠을 지우고, 프라이버시 디스플레이로 당신의 시선을 지키다.</span>
            </div>
        </div>
        <div>
            <ul>
                <li><a href="camera.html">카메라 알아보기</a></li>
                <li><a href="menu.html">알아보기</a></li>
                <li><a href="menu.html">알아보기</a></li>
                <li><a href="menu.html">알아보기</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
