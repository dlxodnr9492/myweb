<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1002 작업 결과</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f4f5f7;
        font-family: Arial, "Noto Sans KR", sans-serif;
        color: #222;
    }

    .container {
        width: 90%;
        max-width: 700px;

        background: white;
        padding: 50px 45px;

        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

        text-align: center;
    }

    .date {
        color: #777;
        font-size: 14px;
        margin-bottom: 12px;
    }

    h1 {
        margin: 0 0 20px;
        font-size: 26px;
        font-weight: 600;
    }

    hr {
        border: none;
        border-top: 1px solid #e5e5e5;
        margin: 25px 0 30px;
    }

    .description {
        color: #666;
        margin-bottom: 25px;
        font-size: 15px;
    }

    .work-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .work-link {
        display: block;

        padding: 16px 20px;

        background: #f8f8f8;
        border: 1px solid #e2e2e2;
        border-radius: 10px;

        color: #333;
        text-decoration: none;
        font-size: 16px;

        transition: 0.2s;
    }

    .work-link:hover {
        background: #222;
        color: white;
        border-color: #222;
        transform: translateY(-2px);
    }

    .footer {
        margin-top: 30px;
        font-size: 13px;
        color: #999;
    }
</style>

</head>

<body>

<div class="container">

    <div class="date">2026. 10. 02</div>

    <h1>작업 결과물</h1>

    <p class="description">
        BNK4 과정 수료생 이태욱의<br>
        10월 02일 작업지시 결과물입니다.
    </p>

    <hr>

    <div class="work-list">
        <a href="letter.html" class="work-link">
            ✉ 편지 작성 웹페이지
        </a>

        <a href="cover.html" class="work-link">
            📖 동화 웹페이지
        </a>

        <a href="java.html" class="work-link">
            💻 JAVA 복습 웹페이지
        </a>
    </div>

    <div class="footer">
        BNK4 · HTML Practice
    </div>

</div>

</body>
</html>
