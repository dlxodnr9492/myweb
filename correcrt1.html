<body>
    <h1>문제 1 정답 페이지입니다.</h1>
    <hr>
    <div class="container">
        <p>
            <span>정답: implements / public</span><br>
            해설: 클래스는 인터페이스를 <span>'구현(implements)'</span>합니다.<br> 
            또한 인터페이스의 모든 규칙은 세상에 100% 공개된 공공재이므로,<br>
            자식이 이를 구현할 때는 무조건 <span>public</span>을 붙여서 공개 범위를 넓게 유지해야만 빨간 줄(컴파일 에러)이 생기지 않습니다.
        </p>
            <img src="img3/correct1.jpg" width="450px" height="400px">
        <hr>
        <p>
            정답을 맞추셨나요? 상단 왼쪽 뒤로가기를 눌러 본인이 쓴 정답과 비교해보세요.
        </p>
    </div>
