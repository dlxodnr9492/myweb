<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intro</title>
    <!-- 삼성원 폰트 정상 작동하는 링크로 적용 -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
            color: white;
            font-family: 'SamsungOne', sans-serif;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 60px;
            padding: 0 5%; /* 양옆에 여백을 주어 풀사이즈에서도 안정감 부여 */
        }
        .main{
            display: flex;
            align-items: center;
            justify-content: center; /* 이미지와 글씨가 가운데로 예쁘게 모이도록 설정 */
            gap: 40px; /* 둘 사이의 간격을 살짝 넓힘 */
            width: 100%;
            max-width: 1400px; /* 대화면에서 무한정 찢어지는 현상 방지 */
        }
        .phone{
            width: 38%;        /* ⭐️ [수정] 기존 50%에서 38%로 줄여서 폰 이미지를 아담하고 세련되게 조절 */
            max-width: 100%;  
            height: auto;
        }
        .comment{
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 15px;
        }
        .comment span:first-child{
            font-size: 32px;  /* 카피 문구 크기를 보기 좋게 조정 */
            color: lightgrey;
            letter-spacing: -0.5px;
        }
        .comment span:last-child{
            font-size: 72px;  /* ⭐️ [수정] 100px은 화면 크기에 따라 줄바꿈이 심하게 깨지므로 가장 황금 비율인 72px로 조정 */
            font-weight: bold;
            letter-spacing: -1px;
            line-height: 1.1;
        }
        /* 하단 링크 스타일링 */
        a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 2px solid white; /* 기획안의 깔끔한 밑줄 구현 */
            padding-bottom: 5px;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
            <img src="img/phone10.jpg" class="phone">
            <div class="comment">
                <span>당신의 가능성을 무한하게</span>
                <span>Galaxy S26 Ultra</span>
            </div>
        </div>
        <div>
            <a href="menu.html">제품에 대해 알아보기</a>
        </div>
    </div>
</body>
</html>
