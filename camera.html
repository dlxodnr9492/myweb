<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>camera</title>
    <link href="https://cdnfonts.com" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
            font-family: 'SamsungOne', sans-serif;
        }
        body {
            background-color: black;
            overflow-x: hidden;
        }
        .main{
            display: flex;
            width: 100%;
            max-width: 1400px;  /* ⭐️ [추가] 대화면(풀사이즈)에서 박스가 무한정 찢어지는 걸 방어합니다 */
            margin: 0 auto;     /* ⭐️ [추가] 제한된 박스를 화면 정중앙에 위치시킵니다 */
            align-items: center;      
            justify-content: space-between;
            gap: 20px;
            padding: 0 40px;    /
        }
        .phone{
            width: 30%;
            max-width: 100%;  
            height: auto;
            
        }
        .camera {
            width: 25%;        /* 좌측 사진과 똑같이 30% 영역을 줍니다 */
            max-width: 100%;
            height: 40vh;      /* 높이도 똑같이 맞춰서 대칭을 이룹니다 */
        }
        .camera img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 사진이 찌러지거나 깨지지 않게 방지 */
        }
        .comment{
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 10px;
            width: 30%;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;

            gap: 80px;
        }
        .comment span:first-child{
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        .comment span:last-child{
            font-size: 24px;
            color: darkgray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
            <img src="phone7.jpg" class="phone">
            <div class="comment">
                <span>기적의 카메라</span>
                <span>어둠 속에서도 빛을 잃지 않는 기적.<br> 
                    빛 한 점 없는 극도의 저조도 환경에서도 
                    2억 화소의 초고해상도 렌즈가 육안으로 
                    볼 수 없던 세포 단위의 디테일까지 선명하게 포착합니다. 
                    Galaxy S26 Ultra의 혁신적인 AI 나이토그래피 프로 센서로 
                    밤의 한계를 깨고 당신의 순간을 작품으로 기록해 보세요.</span>
            </div>
            <div class="camera">
                <img src="img/camera2.jpg">
            </div>
        </div>
        
        <div>
        <a href=#>구매하기</a>   
        </div>
    </div>
    
</body>
</html>
